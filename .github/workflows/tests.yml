name: Run MLOps Tests

on:
  push:
    branches: [ mlops-tasks, main ]
  pull_request:
    branches: [ mlops-tasks, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies (pinned, CPU)
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y transformers accelerate peft torch torchvision torchaudio tokenizers numpy || true
        pip install --no-cache-dir "numpy<2.0"
        pip install --no-cache-dir \
          torch==2.2.1 torchvision==0.17.1 torchaudio==2.2.1 \
          --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt
    
    - name: Install test tools
      run: |
        pip install pytest==8.4.2 pytest-cov
    
    - name: Run tests
      run: python -m pytest -v -s tests/

