name: Run MLOps Tests

on:
  push:
    branches: [ mlops-tasks, main ]
  pull_request:
    branches: [ mlops-tasks, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies (pinned, CPU)
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y transformers peft numpy || true
        pip install --no-cache-dir "numpy<2.0"
    
        pip install --no-cache-dir \
          torch==2.2.1 torchvision==0.17.1 torchaudio==2.2.1 \
          --index-url https://download.pytorch.org/whl/cpu

        pip install --no-cache-dir \
          "transformers==4.41.2" "accelerate==0.29.3" "peft==0.10.0" \
          "datasets==2.19.0" "scikit-learn==1.4.2" "pyyaml==6.0.1"
    
        if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
    
        pip install --no-cache-dir pytest




    - name: Run tests
      run: |
        pytest -v -s tests/
